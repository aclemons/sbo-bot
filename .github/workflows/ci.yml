name: Run tests

on: [pull_request]

concurrency:
  group: pr-check-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      # renovate: datasource=pypi depName=pre-commit
      PRE_COMMIT_VERSION: '4.6.0'
      # renovate: datasource=pypi depName=uv
      UV_VERSION: '0.11.29'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          show-progress: false
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Start docker compose base services
        run: |
          nohup docker compose up -d --wait --quiet-pull github-local-api-gateway webhook-api-local-api-gateway moto wiremock &
          echo "COMPOSE_PID=$!" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: 'webhook-api/uv.lock'

      - name: Configure pre-commit repo cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/pre-commit
          key:
            ${{ runner.os }}-pre-commit-repo-${{ env.pythonLocation }}-${{
            hashFiles('.pre-commit-config.yaml') }}

      - name: Configure pre-commit install cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: pre_commit_install_cache
        with:
          path: ~/.pre-commit-venv
          key:
            ${{ runner.os }}-pre-commit-venv-${{ env.PRE_COMMIT_VERSION }}-${{
            env.pythonLocation }}

      - name: Install pre-commit
        if: steps.pre_commit_install_cache.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/.pre-commit-venv
          # shellcheck source=/dev/null
          . ~/.pre-commit-venv/bin/activate
          pip install pre-commit==${{ env.PRE_COMMIT_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            github/package-lock.json
            e2e-tests/package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: 'webhook-api/.python-version'

      - name: Install github dependencies
        working-directory: github
        run: |
          npm ci

      - name: Install python dependencies
        working-directory: webhook-api
        run: |
          uv sync --all-extras --dev --frozen

      - name: Install e2e-tests dependencies
        working-directory: e2e-tests
        run: |
          npm ci

      - name: Build github-app
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          cache-from: type=gha,scope=githubapp
          context: github
          file: github/Dockerfile
          load: true
          platforms: linux/arm64/v8
          provenance: false
          push: false
          tags: |
            sbobot/bot:github-app-latest

      - name: Build webhook-api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          cache-from: type=gha,scope=webhook-api
          context: webhook-api
          file: webhook-api/Dockerfile
          load: true
          platforms: linux/arm64/v8
          provenance: false
          push: false
          tags: |
            sbobot/bot:webhook-api-latest

      - name: Start remaining docker compose services
        run: |
          timeout 20 bash -c "while kill -0 $COMPOSE_PID 2> /dev/null; do sleep 1; done"
          ./seed.sh
          docker compose up -d --wait --quiet-pull

      - name: Run pre-commit
        run: |
          # shellcheck source=/dev/null
          . ~/.pre-commit-venv/bin/activate
          pre-commit run --all-files --color=always --show-diff-on-failure

      - name: Run TypeScript type-checks
        run: |
          npm run --prefix github typecheck
          npm run --prefix e2e-tests typecheck

      - name: Run pytests
        working-directory: webhook-api
        run: |
          uv run pytest

      - name: Run e2e-tests
        working-directory: e2e-tests
        run: |
          npm run test
