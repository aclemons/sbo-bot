name: Run tests

on: [pull_request]

concurrency:
  group: pr-check-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=docker/buildx
      BUILDX_VERSION: 'v0.38.1'
      # renovate: datasource=pypi depName=pre-commit
      PRE_COMMIT_VERSION: '4.7.0'
      # renovate: datasource=pypi depName=uv
      UV_VERSION: '0.13.5'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      # tests our custom action during renovate updates etc
      - name: Setup opentofu
        uses: ./.github/actions/setup-opentofu

      - name: Configure buildkit image
        run: |
          BUILDKIT_IMAGE="$(awk '/^FROM / {print $2}' buildkit/Dockerfile)"
          printf "BUILDKIT_IMAGE=%s\n" "$BUILDKIT_IMAGE" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Start docker compose base services
        run: |
          nohup docker compose up -d --wait --quiet-pull github-local-api-gateway webhook-api-local-api-gateway moto wiremock &
          echo "COMPOSE_PID=$!" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: 'webhook-api/uv.lock'

      - name: Configure pre-commit repo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key:
            ${{ runner.os }}-pre-commit-repo-${{ env.pythonLocation }}-${{
            hashFiles('.pre-commit-config.yaml') }}

      - name: Configure pre-commit install cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pre_commit_install_cache
        with:
          path: ~/.pre-commit-venv
          key:
            ${{ runner.os }}-pre-commit-venv-${{ env.PRE_COMMIT_VERSION }}-${{
            env.pythonLocation }}

      - name: Install pre-commit
        if: steps.pre_commit_install_cache.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/.pre-commit-venv
          # shellcheck source=/dev/null
          . ~/.pre-commit-venv/bin/activate
          pip install pre-commit==${{ env.PRE_COMMIT_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            github/package-lock.json
            e2e-tests/package-lock.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: 'webhook-api/.python-version'

      - name: Install github dependencies
        working-directory: github
        run: |
          npm ci

      - name: Install python dependencies
        working-directory: webhook-api
        run: |
          uv sync --all-extras --dev --frozen

      - name: Install e2e-tests dependencies
        working-directory: e2e-tests
        run: |
          npm ci

      - name: Build github-app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          cache-from: type=gha,scope=githubapp
          context: github
          file: github/Dockerfile
          load: true
          platforms: linux/arm64/v8
          provenance: false
          push: false
          tags: |
            sbobot/bot:github-app-latest

      - name: Build webhook-api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          cache-from: type=gha,scope=webhook-api
          context: webhook-api
          file: webhook-api/Dockerfile
          load: true
          platforms: linux/arm64/v8
          provenance: false
          push: false
          tags: |
            sbobot/bot:webhook-api-latest

      - name: Start remaining docker compose services
        run: |
          timeout 20 bash -c "while kill -0 $COMPOSE_PID 2> /dev/null; do sleep 1; done"
          ./seed.sh
          docker compose up -d --wait --quiet-pull

      - name: Run pre-commit
        run: |
          # shellcheck source=/dev/null
          . ~/.pre-commit-venv/bin/activate
          pre-commit run --all-files --color=always --show-diff-on-failure

      - name: Run TypeScript type-checks
        run: |
          npm run --prefix github typecheck
          npm run --prefix e2e-tests typecheck

      - name: Run pytests
        working-directory: webhook-api
        run: |
          uv run pytest

      - name: Run e2e-tests
        working-directory: e2e-tests
        run: |
          npm run test
